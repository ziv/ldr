<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Three.js LDraw Viewer - Local DB</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fafafa; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif; font-size: 20px; color: #333;
            background: rgba(255,255,255,0.9); padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="loading">טוען מודל ולבנים מהשרת... <span>0</span>%</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { LDrawLoader } from 'three/addons/loaders/LDrawLoader.js';


    // 1. הגדרת הנתיבים (הכל באותו שרת)
    const PARTS_LIBRARY_PATH = './db/'; // הנתיב לתיקיית הבסיס של LDraw
    // const MODEL_URL = './db/models/pyramid.ldr';     // הנתיב למודל שלך
    const MODEL_URL = './example.ldr';     // הנתיב למודל שלך

    let scene, camera, renderer, controls;
    const loadingDiv = document.getElementById('loading');
    const progressSpan = loadingDiv.querySelector('span');

    init();
    animate();

    function init() {
        // --- הקמת הסצנה ---
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- תאורה ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(1, 1.2, 0.5).normalize();
        scene.add(directionalLight);

        // --- טעינת ה-LDraw ---
        const loader = new LDrawLoader();
        loader.preloadMaterials(PARTS_LIBRARY_PATH + 'LDConfig.ldr');

        // הגדרת הנתיב למסד הנתונים הסטטי שלך
        loader.setPartsLibraryPath(PARTS_LIBRARY_PATH);

        // טעינת המודל הישירה (הלואדר ימשוך את החלקים החסרים בעצמו)
        loader.load(
            MODEL_URL,
            function (group) {
                console.log(group);
                // הצלחה: הוספה לסצנה
                group.rotation.x = Math.PI; // התאמת צירים
                scene.add(group);

                centerModel(group);
                loadingDiv.style.display = 'none';
            },
            function (xhr) {
                // עדכון התקדמות
                if (xhr.lengthComputable) {
                    const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                    progressSpan.innerText = percentComplete;
                }
            },
            function (error) {
                // טיפול בשגיאות
                console.error('Error loading model or parts:', error);
                loadingDiv.innerText = 'שגיאה בטעינה. בדוק את ה-Console.';
            }
        );

        window.addEventListener('resize', onWindowResize);
    }

    function centerModel(group) {
        const box = new THREE.Box3().setFromObject(group);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = camera.fov * (Math.PI / 180);
        let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));

        camera.position.set(center.x, size.y + (maxDim * 0.5), cameraZ * 1.5);
        controls.target.copy(center);
        controls.update();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
