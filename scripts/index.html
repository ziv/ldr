<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Voxelizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
    #controls { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #16213e; flex-shrink: 0; flex-wrap: wrap; }
    #controls label { font-size: 14px; }
    #controls input[type="file"] { max-width: 220px; font-size: 13px; }
    #controls input[type="number"] { width: 80px; padding: 4px 6px; border: 1px solid #444; border-radius: 4px; background: #0f3460; color: #eee; }
    #controls button { padding: 6px 16px; border: none; border-radius: 4px; background: #e94560; color: #fff; cursor: pointer; font-weight: 600; }
    #controls button:disabled { opacity: 0.4; cursor: default; }
    #progress-wrap { height: 4px; background: #0f3460; flex-shrink: 0; }
    #progress-bar { height: 100%; width: 0%; background: #e94560; transition: width 0.1s; }
    #stats { font-size: 13px; color: #aaa; padding: 4px 16px; background: #16213e; flex-shrink: 0; }
    #viewport { flex: 1; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/",
      "three-mesh-bvh": "/node_modules/three-mesh-bvh/src/index.js"
    }
  }
  </script>
</head>
<body>

<div id="controls">
  <label>GLB file: <input type="file" id="file-input" accept=".glb" /></label>
  <label>Voxel size: <input type="number" id="voxel-size" value="0.1" min="0.001" step="0.001" /></label>
  <button id="run-btn" disabled>Voxelize</button>
  <button id="download-btn" disabled>Download JSON</button>
</div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="stats"></div>
<div id="viewport"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { voxelize } from './voxelizer.js';

// ── DOM refs ──
const fileInput    = document.getElementById('file-input');
const voxelInput   = document.getElementById('voxel-size');
const runBtn       = document.getElementById('run-btn');
const downloadBtn  = document.getElementById('download-btn');
const progressBar  = document.getElementById('progress-bar');
const statsEl      = document.getElementById('stats');
const viewport     = document.getElementById('viewport');

// ── Three.js setup ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
viewport.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 1000);
camera.position.set(3, 3, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// Grid helper
scene.add(new THREE.GridHelper(10, 20, 0x333355, 0x222244));

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

// ── State ──
let glbBuffer = null;
let lastResult = null;
let voxelMesh = null;

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  glbBuffer = await file.arrayBuffer();
  runBtn.disabled = false;
  statsEl.textContent = `Loaded: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
});

runBtn.addEventListener('click', async () => {
  if (!glbBuffer) return;

  const voxelSize = parseFloat(voxelInput.value);
  if (!(voxelSize > 0)) { alert('Voxel size must be > 0'); return; }

  runBtn.disabled = true;
  downloadBtn.disabled = true;
  progressBar.style.width = '0%';
  statsEl.textContent = 'Voxelizing…';

  const t0 = performance.now();

  try {
    const result = await voxelize(glbBuffer, voxelSize, (p) => {
      progressBar.style.width = `${(p * 100).toFixed(1)}%`;
    });
    lastResult = result;

    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    const [sx, sy, sz] = result.size;
    const filled = result.voxels.length;

    statsEl.textContent =
      `Grid: ${sx}×${sy}×${sz} (${(sx * sy * sz).toLocaleString()} voxels) ` +
      `| Filled: ${filled.toLocaleString()} | Time: ${elapsed}s`;

    progressBar.style.width = '100%';
    downloadBtn.disabled = false;
    showVoxels(result);
  } catch (err) {
    statsEl.textContent = `Error: ${err.message}`;
    console.error(err);
  } finally {
    runBtn.disabled = false;
  }
});

downloadBtn.addEventListener('click', () => {
  if (!lastResult) return;
  const json = JSON.stringify(lastResult);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'voxels.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ── Visualization ──
function showVoxels(result) {
  if (voxelMesh) {
    scene.remove(voxelMesh);
    voxelMesh.geometry.dispose();
    voxelMesh.material.dispose();
    voxelMesh = null;
  }

  const { voxels, size: [sx, sy, sz], origin, voxelSize } = result;

  if (voxels.length === 0) return;

  const boxGeo = new THREE.BoxGeometry(voxelSize * 0.92, voxelSize * 0.92, voxelSize * 0.92);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4488ff, roughness: 0.6, metalness: 0.2 });
  const instanced = new THREE.InstancedMesh(boxGeo, mat, voxels.length);

  const matrix = new THREE.Matrix4();
  for (let i = 0; i < voxels.length; i++) {
    const [x, y, z] = voxels[i];
    matrix.setPosition(
      origin.x + (x + 0.5) * voxelSize,
      origin.y + (y + 0.5) * voxelSize,
      origin.z + (z + 0.5) * voxelSize,
    );
    instanced.setMatrixAt(i, matrix);
  }
  instanced.instanceMatrix.needsUpdate = true;

  scene.add(instanced);
  voxelMesh = instanced;

  // Fit camera to model
  const box = new THREE.Box3().setFromObject(instanced);
  const center = box.getCenter(new THREE.Vector3());
  const sphere = box.getBoundingSphere(new THREE.Sphere());

  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(1, 0.8, 1).normalize().multiplyScalar(sphere.radius * 2.2));
  camera.lookAt(center);
  controls.update();
}
</script>
</body>
</html>
